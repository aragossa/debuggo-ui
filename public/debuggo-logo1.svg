<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .logo-text { 
        font-family: 'Inter', sans-serif; 
        font-weight: 600; 
        fill: #00BFA5; 
      }
      .gear-icon { 
        fill: #00BFA5; 
      }
    </style>
  </defs>
  
  <!-- Debuggo Text -->
  <text x="10" y="40" class="logo-text" font-size="32">Debuggo</text>
  
  <!-- Gear Icon -->
  <g class="gear-icon" transform="translate(165, 15)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#00BFA5" stroke-width="3"/>
    <circle cx="15" cy="15" r="4" fill="#00BFA5"/>
    <!-- Gear teeth -->
    <rect x="13" y="0" width="4" height="6" fill="#00BFA5"/>
    <rect x="13" y="24" width="4" height="6" fill="#00BFA5"/>
    <rect x="0" y="13" width="6" height="4" fill="#00BFA5"/>
    <rect x="24" y="13" width="6" height="4" fill="#00BFA5"/>
    <rect x="4.5" y="4.5" width="4" height="4" fill="#00BFA5" transform="rotate(45 6.5 6.5)"/>
    <rect x="21.5" y="4.5" width="4" height="4" fill="#00BFA5" transform="rotate(45 23.5 6.5)"/>
    <rect x="4.5" y="21.5" width="4" height="4" fill="#00BFA5" transform="rotate(45 6.5 23.5)"/>
    <rect x="21.5" y="21.5" width="4" height="4" fill="#00BFA5" transform="rotate(45 23.5 23.5)"/>
  </g>
</svg>
